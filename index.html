<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI虚拟实验室</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #2c3e50;
            font-size: 42px;
            margin-bottom: 20px;
        }

        p {
            color: #666;
            font-size: 22px;
            margin-bottom: 35px;
        }

        .section-title {
            max-width: 650px;
            margin: 0 auto 25px;
            padding-bottom: 12px;
            border-bottom: 4px solid #f2994a;
            color: #34495e;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
        }

        video {
            width: 100%;
            max-width: 900px;
            margin-top: 10px;
            border-radius: 10px;
            background: black;
        }

        .footer {
            margin-top: 25px;
            color: #999;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .container {
                margin: 0;
                padding: 25px 20px;
                border-radius: 0;
            }

            h1 {
                font-size: 36px;
            }

            p {
                font-size: 20px;
            }

            .section-title {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AI虚拟实验室</h1>

    <p>
        AI生命科学主题作品展示
    </p>

    <div class="section-title">
        生物进化
    </div>

    <video controls playsinline preload="metadata">
        <source src="demo.mp4" type="video/mp4">
        您的浏览器不支持视频播放。
    </video>

    <div class="footer">
        扫描二维码即可在线查看作品
    </div>

</div>

</body>

</html>
